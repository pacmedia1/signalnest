<div class="container container--narrow" style="padding-block:clamp(16px,3vw,32px)">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="/">Home</a></li>
      <li><span aria-current="page">{{page.heading}}</span></li>
    </ol>
  </nav>

  <h1 style="margin:12px 0 24px;font-size:var(--step-4);font-weight:800">{{page.heading}}</h1>

  <div class="prose" style="max-width:100%">
    {{{page.body}}}
  </div>

  {{#if page.updatedLabel}}
  <div class="article-foot" style="margin-top:3em">
    <span>Last updated: {{page.updatedLabel}}</span>
    <a href="/about">About SignalNest</a>
  </div>
  {{/if}}
</div>
