<div class="container container--narrow text-center" style="padding-block:clamp(56px,8vw,100px)">

    <span class="profile-badge" style="background:rgba(242,140,40,0.2);color:var(--brand);margin-bottom:12px">Error 404</span>
    <h1 style="margin:14px 0 16px;font-size:var(--step-3);font-weight:800">Page Not Found</h1>
