<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SignalNest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="60%" stop-color="#1f1813"/>
      <stop offset="100%" stop-color="#2a170a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F28C28"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#F28C28" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g opacity="0.12" stroke="#FF9F43" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Glass card overlay -->
  <rect x="50" y="50" width="1100" height="530" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(242,140,40,0.25)" stroke-width="1.5"/>
  <text x="90" y="140" fill="#F28C28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">SIGNALNEST</text>
  <text x="90" y="260" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">Clear signal.<tspan fill="url(#orangeGrad)"> Useful knowledge.</tspan></text>
  <text x="90" y="340" fill="#FF9F43" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" letter-spacing="0.5">Original, human-reviewed guides on technology, business &amp; skills</text>
  <text x="90" y="420" fill="#e5e5e5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Practical, verifiable explanations — designed to answer real questions clearly.</text>
  <circle cx="1020" cy="460" r="70" fill="none" stroke="#F28C28" stroke-width="6" opacity="0.6"/>
  <circle cx="1020" cy="460" r="26" fill="url(#orangeGrad)"/>
</svg>
